})();
const MW=480, MH=752;                      // 모바일 화면 해상도 (세로를 줄여 게임 화면을 키움)

function fit(){
  const vw=VWid(), vh=VHei();
  if(view.width!==vw||view.height!==vh){ view.width=vw; view.height=vh; }
  vctx.imageSmoothingEnabled=false;
  const s=Math.min(innerWidth/vw,(innerHeight-(MOBILE?4:26))/vh);
  view.style.width=Math.max(1,Math.floor(vw*s))+'px';
  view.style.height=Math.max(1,Math.floor(vh*s))+'px';
  const tip=document.getElementById('tip');
  if(tip) tip.style.display=MOBILE?'none':'block';
}

const DP={cx:104,cy:578,s:58,g:62};
const MOB_BTNS=[
  {key:'ArrowUp',   label:'▲', kind:'r', size:19, x:DP.cx-DP.s/2,      y:DP.cy-DP.g-DP.s/2, w:DP.s, h:DP.s},

  {key:'ArrowRight',label:'▶', kind:'r', size:19, x:DP.cx+DP.g-DP.s/2, y:DP.cy-DP.s/2,      w:DP.s, h:DP.s},
  {key:'Enter',     label:'확인',   kind:'c', cx:382, cy:578, r:46, big:true},

function inBtn(b,x,y){
  if(b.kind==='c'){ const dx=x-b.cx, dy=y-b.cy; return dx*dx+dy*dy<=b.r*b.r; }
  return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
}
let touchKeys=new Set();
function applyTouchKeys(pts){
  const now=new Set();
  for(const p of pts) for(const b of MOB_BTNS) if(inBtn(b,p.x,p.y)) now.add(b.key);
  for(const k of now)       if(!touchKeys.has(k)){ pressed[k]=true; keys[k]=true; }
  for(const k of touchKeys) if(!now.has(k))       { keys[k]=false; }
  touchKeys=now;
}
function viewPt(clientX,clientY){
  const r=view.getBoundingClientRect();
  return { x:(clientX-r.left)*(VWid()/r.width), y:(clientY-r.top)*(VHei()/r.height) };
}
let ptDown=false, ptGame=null;          // 누르고 있는 동안의 게임좌표 (건너뛰기 버튼 홀드용)
function toGame(p){
  const ga=gameArea();
  if(p.x<ga.x||p.x>ga.x+ga.w||p.y<ga.y||p.y>ga.y+ga.h) return null;
  return { x:(p.x-ga.x)*(W/ga.w), y:(p.y-ga.y)*(H/ga.h) };
}
function gameTap(p){
  const g=toGame(p);
  if(!g) return false;
  click=g; ptGame=g; return true;
}
function onTouch(e){
  e.preventDefault();
  if(e.type==='touchstart'){
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      gameTap(viewPt(t.clientX,t.clientY));
    }
  }
  const pts=[];
  for(let i=0;i<e.touches.length;i++) pts.push(viewPt(e.touches[i].clientX,e.touches[i].clientY));
  // 게임 화면을 누르고 있는 손가락 추적
  ptDown=false; if(e.type!=='touchstart') ptGame=null;
  for(const p of pts){ const g=toGame(p); if(g){ ptDown=true; ptGame=g; break; } }
  applyTouchKeys(pts);
}
view.addEventListener('touchstart',onTouch,{passive:false});
view.addEventListener('touchmove', onTouch,{passive:false});
view.addEventListener('touchend',  onTouch,{passive:false});
view.addEventListener('touchcancel',onTouch,{passive:false});

let mouseDown=false;
view.addEventListener('mousedown',e=>{
  mouseDown=true; ptDown=true;
  const p=viewPt(e.clientX,e.clientY);
  gameTap(p);
  if(MOBILE) applyTouchKeys([p]);
});
view.addEventListener('mousemove',e=>{
  if(!mouseDown) return;
  const p=viewPt(e.clientX,e.clientY);
  const g=toGame(p); if(g) ptGame=g;
  if(MOBILE) applyTouchKeys([p]);
});
addEventListener('mouseup',()=>{ mouseDown=false; ptDown=false; ptGame=null; if(MOBILE) applyTouchKeys([]); });
view.addEventListener('contextmenu',e=>{ if(MOBILE) e.preventDefault(); });

let AC=null, muted=false;
function ac(){ if(AC===null){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } } return AC; }
function beep(f,d,t,v){
  if(muted) return; const a=ac(); if(!a) return;
  try{
    const o=a.createOscillator(), g=a.createGain();
    o.type=t||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(v||0.05,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.08));
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.08));
  }catch(e){}
}
const SFX={
  type:()=>beep(400+Math.random()*90,0.03,'square',0.025),
  menu:()=>beep(660,0.05,'square',0.04),
  ok  :()=>beep(880,0.07,'square',0.05),
  thud:()=>beep(80,0.30,'sawtooth',0.09),
  slap:()=>{ beep(1400,0.04,'square',0.08); setTimeout(()=>beep(160,0.22,'sawtooth',0.08),40); },
  tv  :()=>{ beep(300,0.05,'square',0.04); setTimeout(()=>beep(520,0.06,'square',0.04),70); },
  stat:()=>{ [200,160,120].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'sawtooth',0.07),i*130)); },
  get :()=>{ [660,880,1180].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'square',0.05),i*80)); },
  dig :()=>beep(140,0.12,'sawtooth',0.05),

};

function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }
function frameR(x,y,w,h,c,t){ t=t||4; rect(x,y,w,t,c); rect(x,y+h-t,w,t,c); rect(x,y,t,h,c); rect(x+w-t,y,t,h,c); }
function text(s,x,y,size,color,align,weight,font){
  ctx.font=(weight?weight+' ':'')+(size||16)+"px '"+(font||'Nanum Gothic Coding')+"', monospace";
  ctx.fillStyle=color||'#fff'; ctx.textAlign=align||'left'; ctx.textBaseline='top';
  ctx.fillText(s,x,y);
}
function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function wrap(str,maxw,size){
  ctx.font=(size||17)+"px 'Nanum Gothic Coding', monospace";
  const out=[]; let line='';
  for(const ch of str){
    if(ctx.measureText(line+ch).width>maxw){ out.push(line); line=ch; }
    else line+=ch;
  }
  out.push(line); return out;
}

/* =========================================================================
   인물 스프라이트 생성기
   팔레트 + 헤어스타일 + 액세서리 조합으로 임의의 캐릭터를 찍어낸다.
   PERSONS 에 항목만 추가하면 SPRITES 에 자동 등록된다.
   ========================================================================= */
function shade(hex,d){
  const n=parseInt(hex.slice(1),16);
  const cl=v=>v<0?0:(v>255?255:v);
  const r=cl(((n>>16)&255)+d), g=cl(((n>>8)&255)+d), b=cl((n&255)+d);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
function makePerson(c){
  const skin=c.skin||'#f0c49c', hair=c.hair||'#2a1a12';
  const top=c.top||'#4a6ac8', pants=c.pants||'#33384d';
  const shoe=c.shoe||shade(pants,-24), sleeve=c.sleeve||top;
  const style=c.style||'short', acc=c.acc||null;
  return function(g,dir,f){
    const b=f?1:0;
    const ox = dir==='left'?-1:(dir==='right'?1:0);
    // 다리 / 신발
    P(g,4,25+b,4,5,pants); P(g,10,25-b,4,5,pants);
    P(g,3,29+b,6,2,shoe);  P(g,9,29-b,6,2,shoe);
    // 몸통
    P(g,3,17,12,9,top); P(g,3,23,12,3,shade(top,-22));
    if(c.stripe){ P(g,3,19,12,2,c.stripe); }
    if(c.collar){ P(g,6,17,6,3,c.collar); }
    // 팔 / 손
    P(g,1,18,2,6,sleeve); P(g,15,18,2,6,sleeve);
    P(g,1,23,2,2,skin);   P(g,15,23,2,2,skin);
    // 얼굴
    P(g,3,4,12,13,skin); P(g,3,15,12,2,shade(skin,-26));
    // 헤어
    if(style==='short'){ P(g,3,3,12,4,hair); P(g,2,5,2,4,hair); P(g,13,5,2,4,hair); }
    else if(style==='bald'){ P(g,2,6,2,3,hair); P(g,13,6,2,3,hair); }
    else if(style==='long'){ P(g,2,2,13,5,hair); P(g,1,4,2,15,hair); P(g,14,4,2,15,hair); P(g,4,4,4,2,shade(hair,26)); }
    else if(style==='bob'){ P(g,2,2,13,5,hair); P(g,1,4,2,9,hair); P(g,14,4,2,9,hair); }
    else if(style==='afro'){ P(g,2,1,14,7,hair); P(g,1,3,2,6,hair); P(g,15,3,2,6,hair); P(g,4,0,4,2,hair); P(g,10,0,4,2,hair); }
    else if(style==='spiky'){ P(g,3,3,12,4,hair); P(g,3,1,2,3,hair); P(g,7,0,2,4,hair); P(g,11,1,2,3,hair); }
    else if(style==='pony'){ P(g,3,2,12,5,hair); P(g,2,4,2,6,hair); P(g,13,4,2,6,hair); P(g,15,7,2,10,hair); }
    else if(style==='cap'){ P(g,3,4,12,3,hair); P(g,3,1,12,4,c.capC||'#c04a5a'); P(g,2,4,15,2,shade(c.capC||'#c04a5a',-30)); }
    else if(style==='lowcap'){                       // 눌러쓴 모자 — 챙이 눈을 덮는다
      const cc=c.capC||'#4a4034';
      P(g,4,5,10,4,hair);
      P(g,3,2,11,5,cc); P(g,2,4,2,4,cc); P(g,13,4,2,4,cc);
      P(g,4,1,9,2,shade(cc,16));
      P(g,1,7,15,2,shade(cc,-30));
    }
    // 눈 / 입
    if(dir==='up'){ P(g,5,7,3,2,shade(skin,-40)); P(g,10,7,3,2,shade(skin,-40)); }
    else{ P(g,5,9,2,2,'#1a1a1a'); P(g,11,9,2,2,'#1a1a1a');
          P(g,7,13,4,1,shade(skin,-60)); }
    // 챙 그늘 : 눈이 잘 안 보인다
    if(c.shady){
      P(g,3,8,12,4,c.shadeC||'#2b2119');
      if(dir!=='up'){ P(g,5+ox,10,2,2,'#7a6a52'); P(g,10+ox,10,2,2,'#7a6a52'); }
    }
    // 액세서리
    if(acc==='glasses'){ P(g,4,8,4,4,'#dfe6f0'); P(g,10,8,4,4,'#dfe6f0'); P(g,8,9,2,1,'#8a8a98');
                         P(g,5,9,2,2,'#1a1a1a'); P(g,11,9,2,2,'#1a1a1a'); }
    else if(acc==='mask'){ P(g,4,11,10,5,'#eef2f6'); P(g,3,12,1,2,'#cfd6e0'); P(g,14,12,1,2,'#cfd6e0'); }
    else if(acc==='scarf'){ P(g,3,16,12,3,c.accC||'#c04a5a'); P(g,4,19,3,5,c.accC||'#c04a5a'); }
    else if(acc==='bag'){ P(g,4,17,2,9,c.accC||'#5a4630'); P(g,3,24,5,4,c.accC||'#5a4630'); }
    else if(acc==='tie'){ P(g,8,17,2,7,c.accC||'#c04a5a'); }
    else if(acc==='head'){ P(g,2,4,14,2,c.accC||'#2a2a34'); }
  };
}

const SP_CX=8.5;
function drawSprite(kind,x,y,scale,dir,f,hair){
  const fn=SPRITES[kind]; if(!fn) return;
  ctx.save(); ctx.translate(Math.round(x),Math.round(y)); ctx.scale(scale,scale);
  fn(ctx,dir||'down',f?1:0,hair); ctx.restore();
}
/* ---- 점순이 : 직접 그린 도트 이미지 사용 ---- */
function jeomImg(frame,walking){
  if(walking){ const im=IMG['jsWalk'+(1+(((frame|0)%3)+3)%3)]; if(imgOK(im)) return im; }
  if(imgOK(IMG.jsIdle)) return IMG.jsIdle;
  for(let i=1;i<=3;i++) if(imgOK(IMG['jsWalk'+i])) return IMG['jsWalk'+i];
  return null;
}
/* cx = 가로중심, footY = 발끝, h = 화면상 키 */
function jeomAt(cx,footY,h,frame,walking,flip){
  const im=jeomImg(frame,walking);
  if(!im){ drawSprite('jeomsun',cx-SP_CX*(h/31),footY-h,h/31,'down',frame); return; }
  const w=im.naturalWidth*(h/im.naturalHeight);
  const dx=Math.round(cx-w/2), dy=Math.round(footY-h), dw=Math.round(w), dh=Math.round(h);
  if(flip){
    ctx.save(); ctx.translate(dx+dw,dy); ctx.scale(-1,1);
    ctx.drawImage(im,0,0,dw,dh); ctx.restore();
  }else ctx.drawImage(im,dx,dy,dw,dh);
}
const JEOM_SCALE=1.16;   // 도트 이미지가 한철보다 조금 크게

/* ---- 호랑이 소녀 : 직접 그린 도트 이미지 사용 ---- */
function tigerImg(frame,walking){
  if(walking){ const im=IMG['tgWalk'+(1+(((frame|0)%3)+3)%3)]; if(imgOK(im)) return im; }
  if(imgOK(IMG.tgIdle)) return IMG.tgIdle;
  for(let i=1;i<=3;i++) if(imgOK(IMG['tgWalk'+i])) return IMG['tgWalk'+i];
  return null;
}
function tigerAt(cx,footY,h,frame,walking,flip){
  const im=tigerImg(frame,walking);
  if(!im){ drawSprite('tiger',cx-SP_CX*(h/31),footY-h,h/31,'down',frame); return; }
  const w=im.naturalWidth*(h/im.naturalHeight);
  ctx.save();
  if(flip){ ctx.translate(Math.round(cx),0); ctx.scale(-1,1); ctx.translate(-Math.round(cx),0); }
  ctx.drawImage(im,Math.round(cx-w/2),Math.round(footY-h),Math.round(w),Math.round(h));
  ctx.restore();
}
const TIGER_SCALE=1.10;

function actor(kind,x,footY,scale,dir,f,hair){
  if(kind==='jeomsun'){ jeomAt(x,footY,31*scale*JEOM_SCALE,f,false,dir==='right'); return; }
  if(kind==='tiger'){ tigerAt(x,footY,31*scale*TIGER_SCALE,f,false,dir==='right'); return; }
  drawSprite(kind,x-SP_CX*scale,footY-31*scale,scale,dir,f,hair);
}
function actorH(scale){ return 31*scale; }
function actorDown(x,footY,scale,hair){
  ctx.save(); ctx.translate(Math.round(x),Math.round(footY)); ctx.rotate(-Math.PI/2);
  ctx.scale(scale,scale); ctx.translate(-SP_CX,-31); spHancheol(ctx,'down',0,hair); ctx.restore();
}

const SKEY='ganggang_save_v3', EKEY='ganggang_endings_v3';
function lsGet(k){ try{ const s=localStorage.getItem(k); return s?JSON.parse(s):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
let ENDING_DEX=lsGet(EKEY)||{};
function unlockEnding(id){ if(!ENDING_DEX[id]){ ENDING_DEX[id]={at:Date.now()}; lsSet(EKEY,ENDING_DEX); } }
function dexCount(){ return ENDING_ORDER.filter(k=>ENDING_DEX[k]).length; }

function toast(msg){ G.toast={msg,t:2.4}; }
function spawnStars(n,x,y){
  for(let i=0;i<n;i++) G.parts.push({x:x+rand(-14,14),y:y+rand(-10,10),
    vx:rand(-70,70),vy:rand(-90,-20),life:rand(0.6,1.2),rot:rand(0,6.28)});
}
function updateParts(dt){
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt; p.rot+=dt*6;
    if(p.life<=0) G.parts.splice(i,1);
  }
}
function drawParts(){
  for(const p of G.parts){
    ctx.globalAlpha=clamp(p.life,0,1);
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    rect(-6,-1,12,2,'#ffe14d'); rect(-1,-6,2,12,'#ffe14d');
    ctx.restore(); ctx.globalAlpha=1;
  }
}
function fadeTo(cb,speed){ G.fadeDir=1; G.fadeCb=cb; G.fadeSpeed=speed||3; }
function updateFade(dt){
  const sp=G.fadeSpeed||3;
  if(G.fadeDir===1){ G.fade+=dt*sp; if(G.fade>=1){ G.fade=1; G.fadeDir=-1; const c=G.fadeCb; G.fadeCb=null; if(c) c(); } }
  else if(G.fadeDir===-1){ G.fade-=dt*sp; if(G.fade<=0){ G.fade=0; G.fadeDir=0; } }
}

const FACE_IMG={ '점순이':'jsFace', '한철':'hcFace', '호랑이':'tgFace', '호랑이 소녀':'tgFace' };
/* 대화창 초상화. 그림 초상화는 선화라서 밝은 판 위에 올린다 */
function drawFace(who,x,y,size){
  // 정체를 숨긴 화자는 실루엣으로 (다른 캐릭터 얼굴이 뜨면 안 된다)
  if(who==='???'){
    rect(x,y,size,size,'#0a0a12');
    ctx.globalAlpha=.5;
    rect(x+size*0.28,y+size*0.20,size*0.44,size*0.46,'#2a2a38');
    rect(x+size*0.20,y+size*0.62,size*0.60,size*0.30,'#2a2a38');
    ctx.globalAlpha=1;
    ctx.font="bold "+Math.round(size*0.46)+"px 'Nanum Gothic Coding', monospace";
    ctx.fillStyle='#6a6a80'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('?',x+size/2,y+size/2);
    ctx.textBaseline='top';
    frameR(x,y,size,size,'#6b6b7a',2);
    return;
  }
  const key=FACE_IMG[who], im=key?IMG[key]:null;
  if(imgOK(im)){
    rect(x,y,size,size,'#f4f2ec');
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,size,size); ctx.clip();
    const w=im.naturalWidth*(size/im.naturalHeight);
    ctx.drawImage(im,Math.round(x+(size-w)/2),y,Math.round(w),size);
    ctx.restore();
    frameR(x,y,size,size,'#6b6b7a',2);
    return;
  }
  rect(x,y,size,size,'#0a0a12'); frameR(x,y,size,size,'#6b6b7a',2);
  const k=PORTRAIT[who];
  if(k) drawSprite(k,x+16,y+12,size/27.5,'down',0,G.player.hair);   // 초상화도 걷기 프레임을 안 쓴다
}

let ffT=0, skipHeld=false;   // 개발자 모드 빨리감기
const SKIP_BTN={x:520,y:306,w:96,h:26};
function say(lines,onDone){ G.dlg={lines,i:0,chars:0,done:false,cb:onDone||null,opts:null,sel:0}; prepLine(); }
function prepLine(){
  const d=G.dlg; if(!d) return;
  const L=d.lines[d.i], o=L[2]||{};
  d.chars=0; d.done=false; d.opts=o.choice||null; d.sel=0;
  if(o.shake) G.shake=o.shake;
  if(o.sfx&&SFX[o.sfx]) SFX[o.sfx]();
  if(o.tv!==undefined){ G.cut.tv=o.tv; if(o.tv) SFX.tv(); }
  if(o.flash) G.cut.flash=o.flash;
  if(o.black!==undefined) G.cut.black=o.black;
  if(o.stars) spawnStars(14,320,200);
  if(o.down) G.player.down=true;
  if(o.hpOne){ G.player.maxhp=1; G.player.hp=1; SFX.stat(); }
  if(o.close) G.closeUp={who:o.close,t:1.5};
  if(o.dodge) G.dodge={t:o.dodge};
  if(o.dodgeEnd) G.dodge=null;
  if(o.fn) o.fn();
}
function updateDialog(dt){
  const d=G.dlg; if(!d) return;

  /* 히든 회피 : W를 누르면 한철이 위로 튄다 */
  if(G.dodge){
    G.dodge.t-=dt;
    if(G.dodge.t<=0) G.dodge=null;
    else if(pressed.KeyW||pressed.ArrowUp){
      pressed.KeyW=false; pressed.ArrowUp=false; G.dodge=null;
      const p=G.player;
      p.hopT=0.5; p.hopFrom=p.y; p.y=Math.max(110,p.y-34); p.dir='up';
      G.shake=0.35; SFX.ok(); spawnStars(10,p.x,p.y-20);
      say(ASSASSIN,()=>killPlayer('assassin'));
      return;
    }
  }

  const total=d.lines[d.i][1].length;

  /* 개발자 모드 : Ctrl(또는 건너뛰기 버튼)을 누르고 있으면 대사를 빠르게 넘긴다.
     선택지에서는 자동으로 고르지 않고 멈춘다. */
  if(SET.dev && !d.opts && (keys.ControlLeft||keys.ControlRight||skipHeld)){
    d.chars=total; d.done=true;
    ffT+=dt;
    if(ffT>=0.045){
      ffT=0; d.i++;
      if(d.i>=d.lines.length){ const cb=d.cb; G.dlg=null; if(cb) cb(); }
      else prepLine();
    }
    return;
  }
  ffT=0;

  if(!d.done){
    const prev=Math.floor(d.chars);
    d.chars+=dt*46;
    if(Math.floor(d.chars)>prev && Math.floor(d.chars)%2===0) SFX.type();
    if(d.chars>=total){ d.chars=total; d.done=true; }
    if(okHit()||click){ click=null; d.chars=total; d.done=true; }
    return;
  }

  /* 선택지 */
  if(d.opts){
    const n=d.opts.length;
    if(upHit())   { d.sel=(d.sel+n-1)%n; SFX.menu(); }
    if(downHit()) { d.sel=(d.sel+1)%n;   SFX.menu(); }
    let go=-1;
    for(let i=0;i<n;i++) if(clickIn(choiceBox(i,n))) go=i;
    if(click) click=null;
    if(okHit()) go=d.sel;
    if(go>=0){ SFX.ok(); const fn=d.opts[go].fn; G.dlg=null; if(fn) fn(); }
    return;
  }

  if(okHit()||click){
    click=null; d.i++; SFX.menu();
    if(d.i>=d.lines.length){ const cb=d.cb; G.dlg=null; if(cb) cb(); }
    else prepLine();
  }
}
/* 선택지는 대화창 안에 표시한다 (대사와 같은 박자로 뭉치지 않게, 선택지는 독립된 단계) */
function choiceBox(i,n){
  const bw=436, bh=27, gap=5, x=150;
  const total=n*bh+(n-1)*gap;
  const top=326, bottom=446;
  const y0=Math.max(top, top+((bottom-top)-total)/2);
  return {x, y:Math.round(y0+i*(bh+gap)), w:bw, h:bh};
}
function drawDialog(){
  const d=G.dlg; if(!d) return;
  const L=d.lines[d.i], who=L[0];
  const bx=20,by=300,bw=600,bh=160;
  rect(bx,by,bw,bh,'#000'); frameR(bx,by,bw,bh,'#fff',4);
  const shown=L[1].slice(0,Math.floor(d.chars));

  if(who==='sys'){
    const ls=wrap(shown,520,17);
    text('※ 시스템',bx+bw/2,by+34,14,'#8a90a4','center','bold');
    for(let i=0;i<ls.length&&i<3;i++) text(ls[i],bx+bw/2,by+66+i*26,18,'#ffe14d','center','bold');
  }else if(who===''){
    const ls=wrap(shown,520,17);
    for(let i=0;i<ls.length&&i<4;i++) text(ls[i],bx+bw/2,by+52+i*26,17,'#b8b8c8','center');
  }else{
    drawFace(who,bx+14,by+16,88);
    if(d.opts && L[1]===''){
      text(who,bx+118,by+14,15,'#8a90a4','left');   // 선택지 단계 : 이름만 작게
    }else{
      text(who,bx+118,by+16,17,'#ffe14d','left','bold');
      const ls=wrap(shown,470,17);
      for(let i=0;i<ls.length&&i<4;i++) text(ls[i],bx+118,by+46+i*26,17,'#fff');
    }
  }

  if(d.done&&d.opts){
    const n=d.opts.length;
    for(let i=0;i<n;i++){
      const b=choiceBox(i,n), on=(d.sel===i);
      rect(b.x,b.y,b.w,b.h,on?'#1c1a10':'#07070c');
      frameR(b.x,b.y,b.w,b.h,on?'#ffe14d':'#6a6a80',3);
      text(d.opts[i].label,b.x+30,b.y+5,16,on?'#ffe14d':'#c8c8d8','left',on?'bold':'');
      if(on&&Math.floor(G.t*3)%2===0) text('▶',b.x+11,b.y+5,15,'#ffe14d','left');
    }
  }else if(d.done&&Math.floor(G.t*3)%2===0) text('▼',bx+bw-34,by+bh-34,16,'#fff');

  // 개발자 모드 : 빨리감기 버튼
  if(SET.dev && !d.opts){
    const b=SKIP_BTN, on=skipHeld;
    rect(b.x,b.y,b.w,b.h,on?'#3a3418':'#12121c');
    frameR(b.x,b.y,b.w,b.h,on?'#ffe14d':'#5a5a70',2);
    text('▶▶ 건너뛰기',b.x+b.w/2,b.y+6,12,on?'#ffe14d':'#a8a8b8','center','bold');
  }
}

function rockMoved(){ return !!(G.flags && G.flags.fever && !G.flags.day2); }
function rockPos(){ return rockMoved() ? {x:302,y:320} : {x:312,y:160}; }
/* 방에 들어설 때 돌맹이 판정 상자를 그 자리로 옮긴다 */
function placeRock(){
  const R=ROOMS.cross; if(!R) return;
  const r=rockPos();
  const o=R.objs.find(v=>v.name==='돌맹이');       if(o){ o.x=r.x-6; o.y=r.y-12; }
  const t=(R.triggers||[]).find(v=>v.id==='rock'); if(t){ t.x=r.x-4; t.y=r.y-2; }
}

function isNight(){ return !!G.flags.night && !G.flags.day2; }

function hasFever(){ return !!G.flags.fever && !G.flags.day2; }

/* ---------- 동료 (점순이가 뒤를 따라다닌다) ---------- */
function hasCompanion(){ return !!G.flags.companion; }
function joinCompanion(){
  G.flags.companion=true;
  const p=G.player;
  G.comp={ x:p.x, y:p.y+30, dir:'down', walk:0 };
  SFX.get();
}
/* 방을 옮기면 점순이를 플레이어 바로 옆의 빈 자리에 다시 세운다 (벽에 끼는 것 방지) */
function placeCompanion(){
  if(!hasCompanion()) return;
  const p=G.player;
  const cands=[[-30,4],[30,4],[0,32],[0,-32],[-26,26],[26,26],[-26,-26],[26,-26],[0,0]];
  for(const c of cands){
    const x=p.x+c[0], y=p.y+c[1];
    if(x>12&&y>12&&!solidAt(x,y,20,24)){ G.comp={x,y,dir:p.dir,walk:0}; return; }
  }
  G.comp={x:p.x,y:p.y,dir:p.dir,walk:0};
}
function compAllowed(){ return hasCompanion() && !(ROOMS[G.room]&&ROOMS[G.room].noCompanion); }
function updateCompanion(dt){
  if(!compAllowed()) return;
  const p=G.player;
  if(!G.comp) G.comp={ x:p.x, y:p.y+30, dir:'down', walk:0, follow:false, moveT:0 };
  const c=G.comp, dx=p.x-c.x, dy=p.y-c.y, d=Math.hypot(dx,dy);
  /* 따라붙기 시작(38)과 멈춤(26) 거리를 다르게 둔다.
     같으면 걸을 때 붙었다 떨어졌다를 반복해서 걷기 프레임이 떨린다 */
  if(d>38) c.follow=true; else if(d<26) c.follow=false;
  if(c.follow && d>1){
    const sp=Math.min(d-22, 190*dt);
    if(sp>0){
      const nx=c.x+dx/d*sp, ny=c.y+dy/d*sp;
      const ox=c.x, oy=c.y;
      if(!solidAt(nx,c.y,20,24)) c.x=nx;
      if(!solidAt(c.x,ny,20,24)) c.y=ny;
      c.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
      const moved=Math.hypot(c.x-ox,c.y-oy);
      // 프레임은 실제로 움직인 거리로 넘긴다 (dt 기준이면 느리게 걸을 때 헛돈다)
      if(moved>0.1){ c.walk+=moved/16; c.moveT=0.18; }
    }
  }
  c.moveT=Math.max(0,(c.moveT||0)-dt);
  c.moving=c.moveT>0;
  if(!c.moving) c.idleT=(c.idleT||0)+dt;
}

/* =========================================================================
   주민 (walkers)
   실외 : 좌 또는 우 한 방향으로 계속 걸어가고, 끝에 닿으면 반대편에서 재등장
   실내 : 제자리에서 아주 조금씩만 움직이고 개는 데리고 다니지 않는다
   ========================================================================= */
const WALK_KINDS=Object.keys(PERSONS).filter(k=>k.indexOf('vil')===0);
function initWalkers(){
  G.walkers=[];
  const R=ROOMS[G.room]; if(!R||!R.walkers) return;
  const wd=R.world||{w:W,h:H}, indoor=!R.outdoor;
  for(const w of R.walkers){
    const dir=w.dir||(Math.random()<.5?-1:1);
    G.walkers.push({
      kind:w.kind||WALK_KINDS[rint(0,WALK_KINDS.length-1)],
      x:(w.x!==undefined?w.x:rand(30,wd.w-30)), y:w.y,
      hx:(w.x!==undefined?w.x:wd.w/2), hy:w.y,
      dir, speed:w.speed||rand(28,42),
      dog:!!w.dog && !indoor,
      indoor, walk:0, wt:0, vx:0, vy:0,
      dx:0, dy:0, dwalk:0, armed:false,
    });
  }
  /* 출입구 바로 앞에서 시작해 들어서자마자 부딪히는 것을 막는다.
     겹쳐 있는 행인은 진행 방향으로 멀찍이 밀어 보낸다. */
  const p0=G.player;
  for(const k of G.walkers){
    if(!k.indoor && Math.abs(k.x-p0.x)<96 && Math.abs(k.y-p0.y)<44){
      k.x+=k.dir*170;
      if(k.x<-40) k.x+=wd.w+80;
      if(k.x>wd.w+40) k.x-=wd.w+80;
    }
    k.dx=k.x-k.dir*26; k.dy=k.y+6;
  }
}
function updateWalkers(dt){
  const R=ROOMS[G.room]; if(!G.walkers||!G.walkers.length) return;
  const wd=R.world||{w:W,h:H};
  const p=G.player, pbox={x:p.x-p.w/2,y:p.y-p.h/2,w:p.w,h:p.h};
  for(const k of G.walkers){
    if(k.indoor){
      // 제자리에서 아주 조금씩
      k.wt-=dt;
      if(k.wt<=0){ k.wt=rand(0.7,1.8); k.vx=rand(-14,14); k.vy=rand(-10,10); }
      const nx=k.x+k.vx*dt, ny=k.y+k.vy*dt;
      if(Math.hypot(nx-k.hx,ny-k.hy)<34){
        if(!solidAt(nx,k.y,18,22)) k.x=nx;
        if(!solidAt(k.x,ny,18,22)) k.y=ny;
      }
      k.dir=k.vx<0?-1:1;
      k.walk+=dt*3;
    }else{
      k.x+=k.dir*k.speed*dt;
      if(k.x<-40) k.x=wd.w+40;
      if(k.x>wd.w+40) k.x=-40;
      k.walk+=dt*(4.5+k.speed*0.09);          // 빨리 걸을수록 보폭도 빨라진다
      // 개는 주인 뒤를 따라온다
      if(k.dog){
        const tx=k.x-k.dir*30, ty=k.y+8;
        const ddx=tx-k.dx, ddy=ty-k.dy, dd=Math.hypot(ddx,ddy);
        if(dd>2){ const s=Math.min(dd,k.speed*1.35*dt); k.dx+=ddx/dd*s; k.dy+=ddy/dd*s; k.dwalk+=dt*9; }
      }
    }
    /* 충돌.
       방에 들어선 순간 이미 겹쳐 있던 행인은 서로 완전히 떨어진 뒤부터 판정한다.
       (병원 등에서 나오자마자 부딪혀 죽던 문제) */
    const kbox={x:k.x-11,y:k.y-13,w:22,h:26};
    const dbox=k.dog?{x:k.dx-10,y:k.dy-8,w:20,h:18}:null;
    if(!k.armed){
      const safe={x:pbox.x-16,y:pbox.y-16,w:pbox.w+32,h:pbox.h+32};
      if(!aabb(safe,kbox) && !(dbox&&aabb(safe,dbox))) k.armed=true;
      continue;
    }
    if(!G.dlg && !G.player.down){
      if(aabb(pbox,kbox)){
        if(k.dog) dogEnding(); else bumpEnding();
        return;
      }
      if(dbox && aabb(pbox,dbox)){ dogEnding(); return; }
    }
  }

/* =========================================================================
   범용 연출 배우 : 지정한 지점까지 걸어와서 멈춘다 (체포·난입 등)
   ========================================================================= */
function spawnActor(o){
  G.actors=G.actors||[];
  G.actors.push({ kind:o.kind, x:o.x, y:o.y, tx:o.tx, ty:o.ty,
                  speed:o.speed||150, walk:0, delay:o.delay||0, done:false,
                  scale:o.scale||2.2, label:o.label||null });
}
function updateActors(dt){
  if(!G.actors||!G.actors.length) return;
  for(const a of G.actors){
    if(a.delay>0){ a.delay-=dt; continue; }
    const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
    if(d<3){ a.done=true; continue; }
    const s=Math.min(d,a.speed*dt);
    a.x+=dx/d*s; a.y+=dy/d*s; a.walk+=dt*9;
    a.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
  }
}
function clearActors(){ G.actors=[]; }
/* 경찰 두 명이 양옆에서 걸어와 붙는다 */
function copsArrive(){
  const p=G.player;
  clearActors();
  spawnActor({kind:'police', x:-40,  y:p.y, tx:p.x-40, ty:p.y, speed:190});
  spawnActor({kind:'police', x:W+40, y:p.y, tx:p.x+40, ty:p.y, speed:190, delay:0.12});
}

/* ---------- 구덩이 ---------- */
function digHole(){
  const f=G.flags;
  if(!has('shovel')){
    say([
      ['','(손으로 땅을 팠다.)',{sfx:'dig'}],
      ['','(돌이 나왔다.)'],
      ['한철','끄아아아아아아아아아아아아악!!!!',{shake:1.0,sfx:'slap',flash:0.5,stars:true,down:true}],
    ],()=>killPlayer('finger'));
    return;
  }
  if(f.shovelBroken){ say([['한철','삽이 부러져서 더는 못 판다.']]); return; }
  f.digs=(f.digs||0)+1;
  SFX.dig();
  // 특수 아이템 둘 다 얻은 뒤 5번 더 파면 삽이 부러진다
  if(f.gotMoney&&f.gotOyes){
    f.digAfter=(f.digAfter||0)+1;
    if(f.digAfter>=5){
      f.shovelBroken=true; takeItem('shovel');
      say([['','(삽이 부러졌다)',{sfx:'thud',shake:0.4}],['한철','삽이 뿌사지삣다..']]);
      return;
    }
  }
  const r=Math.random();
  if(r<0.20&&!f.gotMoney){
    f.gotMoney=true; give('money');
    say([['','(1000원짜리 지폐가 나왔다.)'],['한철','오! 돈이다! 오늘 운세가 좋은걸.'],['sys','1000원짜리 지폐 획득']]);
  }else if(r<0.40&&!f.gotOyes){
    f.gotOyes=true; give('oyes');
    say([['','(오예스가 나왔다.)'],['한철','누군가 지 먹으려고 땅에 숨겨놓은거 같다.'],['sys','오예스 획득']]);
  }else{
    say([['','(흙이 나왔다)']]);
  }
}

/* ---------- 병원 ---------- */
function hosTicketCount(){ return G.flags.hosTickets||0; }
function hosNum(){ return G.flags.hosNum||0; }
function hosMark(){ if(hosTicketCount()>0) G.flags.hosInteract=(G.flags.hosInteract||0)+1; }

function drawTicket(){
  const f=G.flags;
  // 열 진단을 받고도 또 번호표를 뽑으면
  if(hasFever()){
    posKill([['한철','번호표 한 장만 더...'],['간호사','집에 가랬지']]);
    return;
  }
  if(f.hosDone){ say([['한철','진료 다 봤는데 또 뽑을 필요는 없겠지.']]); return; }
  f.hosTickets=(f.hosTickets||0)+1;
  const n=f.hosTickets;
  f.hosNum = (n===1) ? rint(50,80) : f.hosNum+1;
  if(!has('ticket')) give('ticket');
  SFX.get();

  if(n>=5){
    say([
      ['sys','번호표를 뽑았다.'],
      ['간호사','내가 한장만뽑으랬지'],
      ['','(간호사가 포스기를 던진다)',{shake:0.6}],
      ['간호사','당장 나가!!!!',{shake:0.8}],
      ['','(퍽)',{shake:1.0,sfx:'slap',flash:0.5,stars:true,down:true}],
    ],()=>killPlayer('pos'));
    return;
  }

  const lines=[];
  if(n===1) lines.push(['sys','번호표를 뽑았다. 기다리자.']);
  else{ lines.push(['sys','번호표를 뽑았다.']); lines.push(['간호사','번호표는 한장만 뽑으시면 됩니다']); }
  lines.push(['sys','번호표 : '+f.hosNum+'번']);

  if(f.hosNum===67){
    lines.push(['간호사','67번 환자분, 들어오세요.']);
    lines.push(['간호사','67?']);

const BANK_SLOT=(i)=>({x:240, y:236+i*46});
function initBankQueue(){
  G.bankQ=[]; G.bankLeaver=null; G.bankT=5;
  if(G.flags.robbed||G.flags.bankDone) return;
  const kinds=['caster','announcer','reader'];
  for(let i=0;i<3;i++){
    const s=BANK_SLOT(i);
    G.bankQ.push({kind:kinds[i], x:s.x, y:s.y, ty:s.y, walk:0});
  }
}
function updateBank(dt){
  if(G.room!=='bank') return;
  G.siren=Math.max(0,(G.siren||0)-dt*0.35);
  if(G.bankLeaver){
    const l=G.bankLeaver;
    l.x+=(320-l.x)*Math.min(1,dt*2); l.y+=150*dt; l.walk+=dt*9;
    if(l.y>470) G.bankLeaver=null;
  }
  if(!G.bankQ||!G.bankQ.length) return;
  for(const q of G.bankQ){
    if(Math.abs(q.y-q.ty)>1){ q.y+=(q.ty-q.y)*Math.min(1,dt*4); q.walk+=dt*8; }
  }
  if(!G.dlg){
    G.bankT-=dt;
    if(G.bankT<=0){
      G.bankT=5;
      G.bankLeaver=G.bankQ.shift();
      for(let i=0;i<G.bankQ.length;i++) G.bankQ[i].ty=BANK_SLOT(i).y;
    }
  }
  // 대기줄에 닿으면 새치기
  if(!G.dlg && !G.player.down){
    const p=G.player, pb={x:p.x-p.w/2,y:p.y-p.h/2,w:p.w,h:p.h};
    for(const q of G.bankQ){
      if(aabb(pb,{x:q.x-11,y:q.y-13,w:22,h:26})){ cutEnding(); return; }
    }
  }
}

const CLUES=[
  {id:'dad',  label:'아버지의 말',   where:'모텔 202호'},
  {id:'cop',  label:'실종 신고',     where:'경찰서 창구'},
  {id:'jail', label:'죄수의 헛소리', where:'경찰서 철창'},
];
function ch3(){ return !!G.flags.ch3; }
function gotClue(id){ return !!G.flags['clue_'+id]; }
function clueCount(){ return CLUES.filter(c=>gotClue(c.id)).length; }
function clueLeft(){ return CLUES.filter(c=>!gotClue(c.id)); }
function addClue(id){
  if(gotClue(id)) return;
  G.flags['clue_'+id]=true;
  SFX.get();
  toast('단서 '+clueCount()+' / '+CLUES.length);
  saveGame(true);          // 단서를 얻은 직후 죽어도 남게
}

function placeVillagers(){
  const R=ROOMS.village; if(!R) return;
  const rx=()=>Math.round(rand(140,VILLAGE_W-200));
  for(const n of R.npcs) if(n.roam){
    n.x=rx(); n.y=Math.round(rand(ROAD_Y+20,ROAD_Y+ROAD_H-26));
  }
  const car=R.objs.find(o=>o.name==='주차된 자동차');
  if(car){ car.x=rx(); car.y=ROAD_Y+ROAD_H-40; }
}

/* 잔디를 밟고 다니면 경고 한 번, 그 다음은 없다 */
function onGrass(){
  if(G.room!=='village') return false;
  const p=G.player;
  if(p.y>ROAD_Y+ROAD_H+4) return true;
  if(p.y<ROAD_Y-6){
    if(p.x>360&&p.x<440) return false;
    for(const inf of INFRA){ const c=inf.x+INFRA_W/2; if(p.x>c-40&&p.x<c+40) return false; }
    return true;
  }
  return false;
}

function clinicCold(){
  const temps=[36.3,36.4,36.5,36.6,36.7,36.8,36.9,37.0];
  const t=temps[Math.floor(Math.random()*temps.length)];
  const lines=[
    ['한철','감기에 걸렸어요.'],
    ['의사','체온 재보겠습니다.'],
    ['sys',t.toFixed(1)+'도'],
  ];
  if(Math.abs(t-36.7)<0.001){
    lines.push(['의사','열은 없네요.']);
    lines.push(['','(간호사가 문을 박차고 들어온다)',{shake:0.6,sfx:'thud'}]);
    lines.push(['간호사','뭐? 67?']);
    lines.push(['의사','네?']);
    lines.push(['간호사','씩스 쎄븐!!!!!!',{shake:0.8}]);
    lines.push(['의사','아니 무슨']);
    lines.push(['한철','뭔가 더 있으면 안될것 같다.']);
    say(lines,()=>{
      G.flags.hosBanned=true; G.flags.hosDone=true;
      fadeTo(()=>enterRoom('village',INFRA[0].x+INFRA_W/2,ROAD_Y+40));
    });
    return;
  }
  lines.push(['의사','열은 없네요. 감기약 드릴테니 물하고 같이 드시면 됩니다.']);
  lines.push(['sys','감기약을 획득했다',{fn:()=>give('cold')}]);

  G.player.y=ty!==undefined?ty:R.start.y;
  G.player.down=false; G.player.hopT=0;
  G.exitCd=0.6; G.wait=null; G.timer=null; G.autoWalk=null; G.rush=null; G.dirtWalk=0; G.tvBlock=0;
  G.walkIn=null; G.doorOpen=0; G.hidePlayer=false; G.playerFade=0; G.actors=[]; G.walkers=[]; G.closeUp=null; G.siren=0;

/* =========================================================================
   필드
   ========================================================================= */
function worldOf(R){ return R.world||{w:W,h:H}; }
function camOf(R){
  const wd=worldOf(R);
  return { x:Math.round(clamp(G.player.x-W/2,0,Math.max(0,wd.w-W))),
           y:Math.round(clamp(G.player.y-H/2,0,Math.max(0,wd.h-H))) };
}
function solidAt(x,y,w,h){
  const box={x:x-w/2,y:y-h/2,w,h};
  for(const wl of ROOMS[G.room].walls) if(aabb(box,wl)) return true;
  return false;
}
function updateField(dt){
  const p=G.player, R=ROOMS[G.room], wd=worldOf(R);
  G.exitCd=Math.max(0,(G.exitCd||0)-dt);
  G.playTime+=dt;
  if(p.hopT>0) p.hopT=Math.max(0,p.hopT-dt);

  // ESC : 일시정지 (인벤토리가 열려 있으면 인벤토리를 먼저 닫는다)
  if(!G.inv && hit('Escape')){ openPause(); return; }

  if(G.dlg){ updateDialog(dt); return; }

  /* 배경 타이머 : 조작을 막지 않는다 (엘리베이터 대기 등) */
  if(G.timer){
    G.timer.t-=dt;
    if(G.timer.t<=0){ const f=G.timer.fn; G.timer=null; if(f) f(); return; }
  }
  /* 자동 이동 : 목적지까지 알아서 걸어간다 */
  if(G.autoWalk){
    const a=G.autoWalk, ddx=a.tx-p.x, ddy=a.ty-p.y, d=Math.hypot(ddx,ddy);
    a.st=(a.st||0)+dt;
    if(d<3||a.st>3.5){
      if(d<3){ p.x=a.tx; p.y=a.ty; }
      G.autoWalk=null; if(a.fn) a.fn();
    }else{
      const step=Math.min(d,120*dt), nx=p.x+ddx/d*step, ny=p.y+ddy/d*step;
      if(!solidAt(nx,p.y,p.w,p.h)) p.x=nx;
      if(!solidAt(p.x,ny,p.w,p.h)) p.y=ny;
      p.dir=Math.abs(ddx)>Math.abs(ddy)?(ddx<0?'left':'right'):(ddy<0?'up':'down');
      p.walk+=dt*7;
    }
    return;
  }
  if(G.wait){
    G.wait.t-=dt;
    if(G.wait.t<=0){ const f=G.wait.fn; G.wait=null; if(f) f(); }
    return;
  }
  if(G.inv){ updateInventory(dt); return; }
  if(hit('KeyE')){ G.inv=true; G.invSel=0; SFX.menu(); return; }

  let dx=0,dy=0;
  if(keys.KeyA||keys.ArrowLeft)  dx-=1;
  if(keys.KeyD||keys.ArrowRight) dx+=1;
  if(keys.KeyW||keys.ArrowUp)    dy-=1;
  if(keys.KeyS||keys.ArrowDown)  dy+=1;
  /* 달리기 : Shift. 5초 달리면 바닥, 안 달리면 5초 만에 회복 */
  const wantRun=!!(keys.ShiftLeft||keys.ShiftRight);
  if(p.runLock && p.stam>0.3) p.runLock=false;
  if(wantRun && p.stam<=0) p.runLock=true;
  const running = wantRun && !p.runLock && p.stam>0 && (dx||dy);
  if(running){ p.stam=Math.max(0,p.stam-dt/5); if(p.stam<=0) p.runLock=true; }
  else       { p.stam=Math.min(1,p.stam+dt/5); }

  if(dx||dy){
    const l=Math.hypot(dx,dy); dx/=l; dy/=l;
    const sp=running?214:116;
    if(Math.abs(dx)>Math.abs(dy)) p.dir=dx<0?'left':'right'; else p.dir=dy<0?'up':'down';
    const nx=p.x+dx*sp*dt, ny=p.y+dy*sp*dt;
    if(!solidAt(nx,p.y,p.w,p.h)) p.x=nx;
    if(!solidAt(p.x,ny,p.w,p.h)) p.y=ny;
    p.x=clamp(p.x,12,wd.w-12); p.y=clamp(p.y,12,wd.h-12);
    p.walk+=dt*7;
  }

  updateCompanion(dt);
  updateWalkers(dt);
  updateBank(dt);

  /* 은행강도 대치 : 움직이면 즉시 사살 */
  if(G.flags.standoff && !G.dlg && !G.autoWalk){
    if(Math.hypot(p.x-(G.standX||p.x), p.y-(G.standY||p.y))>6){ standoffMoved(); return; }
  }

  /* 비포장도로 : 혼자서 도로 위에 1.5초 이상 있으면 경운기가 돌진한다.
     도로 아래 갓길로 내려가면 피할 수 있다. */
  if(G.room==='dirt' && !hasCompanion() && !G.flags.tillerDone){
    const onRoad = (p.y>=206 && p.y<=304);
    if(onRoad) G.dirtWalk=(G.dirtWalk||0)+dt;
    else       G.dirtWalk=Math.max(0,(G.dirtWalk||0)-dt*2);
    if((G.dirtWalk||0)>=1.5){
      G.flags.tillerDone=true; G.dirtWalk=0;
      G.rush={x:W+60,y:p.y,t:0};
      say([['경운기','앞좀 보고다녀라',{shake:0.7,sfx:'thud'}],
           ['한철','크억',{shake:1.0,sfx:'slap',flash:0.5,stars:true,down:true}],
      ],()=>killPlayer('tiller'));
      return;
    }
  }

  /* 집 : 점순이가 보고 있는 TV 앞을 0.5초 이상 막고 서 있으면 리모컨이 날아온다 */
  if(G.room==='home' && G.cut.tv && !G.flags.outside && !G.flags.tvBlockDone){
    const front = (p.x>420 && p.x<548 && p.y>182 && p.y<218);
    G.tvBlock = front ? (G.tvBlock||0)+dt : 0;
    if(G.tvBlock>=0.5){
      G.flags.tvBlockDone=true; G.tvBlock=0;
      say([['점순이','야 TV 가려서 안보이잖아'],
           ['점순이','안비켜?'],
           ['점순이','안에 사람들이 있잖아!!!!'],
           ['점순이','(리모컨을 던진다)',{shake:0.4}],
           ['','(퍽)',{shake:1.0,sfx:'slap',flash:0.5,stars:true}],
           ['한철','크억',{down:true}],
      ],()=>killPlayer('tvblock'));
      return;
    }
  }

  /* 마을 잔디를 계속 밟고 다니면 개미가 화를 낸다 */
  if(G.room==='village' && !G.flags.antDead){
    if(onGrass()&&(dx||dy)) G.grassT=(G.grassT||0)+dt;
    else                    G.grassT=Math.max(0,(G.grassT||0)-dt*2);
    if((G.grassT||0)>=2){ G.grassT=0; antGrass(); return; }
  }

  // 밟는 함정 / 자동 진입
  for(const tr of (R.triggers||[])){
    if(tr.when&&!tr.when()) continue;
    if(G.flags['trig_'+tr.id]) continue;
    if(aabb({x:p.x-p.w/2,y:p.y-p.h/2,w:p.w,h:p.h},tr)){
      G.flags['trig_'+tr.id]=true; tr.fn(); return;
    }
  }

  // 조사 / 대화
  if(okHit()||click){
    click=null;
    const fx=p.x+(p.dir==='left'?-24:p.dir==='right'?24:0);
    const fy=p.y+(p.dir==='up'?-24:p.dir==='down'?24:0);
    for(const n of (R.npcs||[])){
      if(n.when&&!n.when()) continue;
      if(Math.hypot(n.x-fx,n.y-fy)<46){ const t=n.talk(); if(t) say(t); return; }
    }
    for(const o of (R.objs||[])) if(aabb({x:fx-16,y:fy-16,w:32,h:32},o)){
      if(o.name!=='컴퓨터') G.flags.pcOff=false;
      if(o.name.indexOf('건물:hospital')!==0) G.flags.hosBanned=false;
      if(o.act) o.act();
      return;
    }
  }

  // 출구
  if(G.exitCd<=0){
    for(const ex of R.exits){
      if(aabb({x:p.x-p.w/2,y:p.y-p.h/2,w:p.w,h:p.h},ex)){
        if(ex.guard&&!ex.guard()){ G.exitCd=1.2; return; }
        if(ex.to==='__NOTICE__'){ fadeTo(()=>enterRoom('void'),1.6); return; }
        const to=ex.to,tx=ex.tx,ty=ex.ty;
        fadeTo(()=>enterRoom(to,tx,ty)); return;
      }
    }
  }
}

function drawField(capture){
  const R=ROOMS[G.room], p=G.player, cam=camOf(R);
  ctx.save();
  if(G.shake>0) ctx.translate(rand(-7,7)*G.shake,rand(-7,7)*G.shake);
  ctx.translate(-cam.x,-cam.y);
  R.bg();

  const FS=2.2, list=[];
  for(const n of (R.npcs||[])){ if(n.when&&!n.when()) continue; list.push({y:n.y,f:()=>{
    shadow(n.x,n.y+13);
    // 서 있는 인물이라 걷기 프레임을 돌리지 않는다 (다리가 계속 움직여 보이던 문제)
    actor(n.kind,n.x,n.y+13,FS,n.dir||'down',0);
    const top=n.y+13-actorH(FS);
    const lb=(typeof n.label==='function')?n.label():n.label;
    if(lb) text(lb,n.x,top-16,11,'#cfd4e0','center','bold');
    if(Math.hypot(n.x-p.x,n.y-p.y)<52&&!G.dlg&&Math.floor(G.t*2)%2===0)
      text('!',n.x,top-(lb?38:22),20,'#ffe14d','center','bold');
  }}); }
  if(!G.hidePlayer) list.push({y:p.y,f:()=>{
    const a=G.playerFade>0?clamp(G.playerFade/0.7,0,1):1;
    ctx.globalAlpha=a;
    shadow(p.x,p.y+13);
    let off=0;
    if(p.hopT>0) off=-Math.sin((1-p.hopT/0.5)*Math.PI)*30;   // 회피 점프
    if(p.down) actorDown(p.x+16,p.y+13,FS,p.hair);
    else actor('hancheol',p.x,p.y+13+off,FS,p.dir,Math.floor(p.walk)%2,p.hair);
    ctx.globalAlpha=1;
  }});
  // 동료 (점순이) — 움직이는 동안은 걷기 3프레임
  if(compAllowed()&&G.comp){
    list.push({y:G.comp.y,f:()=>{
      shadow(G.comp.x,G.comp.y+13);
      const c=G.comp;
      const bob=c.moving?0:Math.sin((c.idleT||0)*2.4)*1.5;
      jeomAt(c.x,c.y+13+bob,31*FS*JEOM_SCALE,Math.floor(c.walk),c.moving,c.dir==='right');
    }});
  }
  // 주민 (walkers) 과 산책 중인 개
  if(G.walkers) for(const k of G.walkers){
    if(k.x<cam.x-70||k.x>cam.x+W+70) continue;          // 화면 밖은 건너뜀
    if(k.dog) list.push({y:k.dy,f:()=>{
      const db=Math.abs(Math.sin(k.dwalk*1.6))*1.5;      // 개도 통통 튀며 걷는다
      shadow(k.dx,k.dy+10);
      drawSprite('dog', k.dx-8.5*1.6, k.dy+10-31*1.6-db, 1.6, k.dir<0?'left':'right', Math.floor(k.dwalk)%2);
    }});
    list.push({y:k.y,f:()=>{
      shadow(k.x,k.y+13);
      // 걷는 동안 위아래로 살짝 튀게 해서 보폭이 보이도록
      const moving = k.indoor ? (Math.abs(k.vx)+Math.abs(k.vy)>3) : true;
      const bob = moving ? Math.abs(Math.sin(k.walk*1.55))*2.2 : 0;
      actor(k.kind,k.x,k.y+13-bob,2.1,k.dir<0?'left':'right',Math.floor(k.walk)%2);
    }});
  }
  // 은행 대기줄
  if(G.room==='bank'){
    if(G.bankQ) for(const q of G.bankQ) list.push({y:q.y,f:()=>{
      shadow(q.x,q.y+13);
      actor(q.kind,q.x,q.y+13,2.1,'up',Math.floor(q.walk)%2);
    }});
    if(G.bankLeaver) list.push({y:G.bankLeaver.y,f:()=>{
      const l=G.bankLeaver;
      shadow(l.x,l.y+13);
      actor(l.kind,l.x,l.y+13,2.1,'down',Math.floor(l.walk)%2);
    }});
  }
  // 연출 배우 (체포하러 오는 경찰 등)
  if(G.actors) for(const a of G.actors){
    if(a.delay>0) continue;
    list.push({y:a.y,f:()=>{
      shadow(a.x,a.y+13);
      actor(a.kind,a.x,a.y+13,a.scale,a.dir||'down',Math.floor(a.walk)%2);
      if(a.label) text(a.label,a.x,a.y+13-actorH(a.scale)-20,15,'#ffe14d','center','bold');
    }});
  }
  // 문을 열고 걸어 들어오는 점순이
  if(G.walkIn && G.walkIn.delay<=0){
    list.push({y:G.walkIn.y,f:()=>{
      shadow(G.walkIn.x,G.walkIn.y+13);
      jeomAt(G.walkIn.x,G.walkIn.y+13,31*FS*JEOM_SCALE,Math.floor(G.walkIn.walk),true);
    }});
  }
  // 엘리베이터에서 튀어나오는 투숙객 / 돌진하는 경운기
  if(G.rush){
    list.push({y:G.rush.y+40,f:()=>{
      shadow(G.rush.x,G.rush.y+13);
      const f=Math.floor(G.rush.t*18)%2;
      actor('thug',G.rush.x,G.rush.y+13,2.2,'left',f);
      for(let i=1;i<=3;i++){                       // 잔상
        ctx.globalAlpha=0.28/i;
        actor('thug',G.rush.x+i*26,G.rush.y+13,2.2,'left',f);
        ctx.globalAlpha=1;
      }
      text('!!!',G.rush.x,G.rush.y-64,18,'#ff6a6a','center','bold');
    }});
  }
  list.sort((a,b)=>a.y-b.y);
  for(const it of list) it.f();

  if(R.over) R.over();     // 인물보다 앞에 그리는 것 (육교 상판 등)
  drawParts();
  // 밤 : 실외 맵에 어둠을 덮는다
  if(isNight()&&R.outdoor){
    ctx.globalAlpha=.52; rect(cam.x,cam.y,W,H,'#0a1030'); ctx.globalAlpha=1;
    ctx.globalAlpha=.12; rect(cam.x,cam.y,W,H,'#3a4a90'); ctx.globalAlpha=1;
  }
  if(G.cut.flash>0){ ctx.globalAlpha=G.cut.flash*0.8; rect(cam.x,cam.y,W,H,'#ff2a3a'); ctx.globalAlpha=1; }
  if(G.cut.black>0){ ctx.globalAlpha=G.cut.black; rect(cam.x,cam.y,W,H,'#000'); ctx.globalAlpha=1; }
  ctx.restore();

  if(capture){ sctx.clearRect(0,0,W,H); sctx.drawImage(cv,0,0); }

  drawHUD();
  // 조작이 막히는 대기 중에는 로딩바 대신 머리 위에 점만 띄운다
  if(G.wait){
    const dots='.'.repeat(1+Math.floor(G.t*2)%3);
    const hx=p.x-cam.x, hy=p.y-cam.y-actorH(2.2)-14;
    text(dots,hx,hy,22,'#fff','center','bold');
  }
  drawCloseUp();
  drawDialog();
  if(G.inv) drawInventory();
  if(G.toast){
    ctx.globalAlpha=clamp(G.toast.t,0,1);
    rect(190,238,260,34,'#000'); frameR(190,238,260,34,'#ffe14d',2);
    text(G.toast.msg,320,247,14,'#ffe14d','center','bold');
    ctx.globalAlpha=1;
  }
}

}

/* =========================================================================
   엔딩 연출
   ========================================================================= */
function startEnding(id){
  const e=ENDINGS[id]; if(!e) return;
  const seen=!!ENDING_DEX[id];          // 이미 본 엔딩이면 곧바로 건너뛸 수 있다
  unlockEnding(id);
  G.ending={id,e,phase:'fadeout',t:0,cred:0,seen,all:0,out:false};
  G.scene='ending'; G.dlg=null; G.inv=false; G.wait=null;
}
/* 가짜 엔딩 : 엔딩 화면이 뜨다가 게임으로 되돌아온다 (도감에 기록되지 않는다) */
function startFakeEnding(name,desc,back){
  G.ending={ id:'__fake__', e:{no:'??',name:name,desc:desc},
             phase:'fadeout', t:0, cred:0, seen:false, all:0, out:false,
             fake:true, back:back };
  G.scene='ending'; G.dlg=null; G.inv=false; G.wait=null;
}
function endFakeEnding(){
  const back=G.ending&&G.ending.back;
  G.ending=null; G.scene='field';
  G.cut.black=0; G.cut.flash=0;
  G.player.down=false; G.player.hopT=0;
  if(back) back();
}
function endingToMenu(){
  fadeTo(()=>{ G.ending=null; G.scene='menu'; G.menu.sel=0; },3);
}
function fmtTime(s){
  s=Math.floor(s); const m=Math.floor(s/60), ss=s%60, h=Math.floor(m/60);
  return (h>0?h+'시간 ':'')+(m%60)+'분 '+ss+'초';
}
function updateEnding(dt){
  const E=G.ending; E.t+=dt; E.all+=dt;
  if(E.out){ if(click) click=null; return; }   // 메뉴로 나가는 중
  /* 가짜 엔딩 : 카드를 띄워 두고, ENTER(또는 클릭)를 누르면 게임으로 되돌아간다 */
  if(E.fake){
    if(E.phase==='fadeout'){
      if(E.t>=1.1){ E.phase='card'; E.t=0; SFX.end(); }
      if(click) click=null;
      return;
    }
    const btn={x:230,y:426,w:180,h:40};
    if(E.t>=0.8&&(okHit()||clickIn(btn))){ click=null; SFX.ok(); endFakeEnding(); return; }
    if(click) click=null;
    return;
  }
  /* 이미 수집한 엔딩이면 0.5초 뒤부터 아무 키나 눌러 바로 메뉴로 */
  if(E.seen && E.all>=0.5 && (okHit()||click)){
    click=null; E.out=true; SFX.ok(); endingToMenu(); return;
  }
  if(E.phase==='fadeout'){ if(E.t>=1.3){ E.phase='card'; E.t=0; SFX.end(); } return; }
  if(E.phase==='card'){
    const btn={x:230,y:426,w:180,h:40};
    if(E.t>=1.4&&(okHit()||clickIn(btn))){ click=null; E.phase='gap'; E.t=0; SFX.ok(); }
    if(click) click=null; return;
  }
  if(E.phase==='gap'){ if(E.t>=0.45){ E.phase='credits'; E.t=0; } return; }
  if(E.phase==='credits'){
    E.cred=E.t*1.7;
    if(E.t>=4.5){ E.phase='theend'; E.t=0; }
    else if(okHit()||click){ click=null; E.t=4.4; }
    return;
  }
  if(E.phase==='theend'){
    if(E.t>0.7&&(okHit()||click)){ click=null; E.out=true; endingToMenu(); }
    return;
  }
}
/* 이미 본 엔딩이라는 안내 (0.5초 뒤부터 아무 키나 누르면 메뉴로) */
function drawEndSkipHint(){
  const E=G.ending;
  if(!E||!E.seen||E.out||E.all<0.5) return;
  ctx.globalAlpha=0.55+0.35*Math.abs(Math.sin(G.t*3));
  text('이미 본 엔딩 · 아무 키나 누르면 메뉴로',320,458,12,'#8a90a4','center');
  ctx.globalAlpha=1;
}

  const E=G.ending;
  if(E.phase==='fadeout'){
    ctx.drawImage(shot,0,0);
    ctx.globalAlpha=clamp(E.t/(E.fake?1.1:1.3),0,1); rect(0,0,W,H,'#000'); ctx.globalAlpha=1;
    drawEndSkipHint(); return;
  }
  rect(0,0,W,H,'#000');
  if(E.phase==='card'){
    ctx.globalAlpha=clamp(E.t/0.8,0,1);
    const ix=140,iy=34,iw=360,ih=270;
    frameR(ix-4,iy-4,iw+8,ih+8,'#fff',4);
    ctx.drawImage(shot,0,0,W,H,ix,iy,iw,ih);
    text('ENDING #'+E.e.no,320,314,14,'#8a90a4','center','bold');

    ctx.fillText(E.e.name,320,334);
    const ds=wrap(E.e.desc,540,16);

      rect(b.x,b.y,b.w,b.h,'#0c0c14'); frameR(b.x,b.y,b.w,b.h,on?'#ffe14d':'#8a8a9a',3);
      text('다  음  ▶',b.x+b.w/2,b.y+11,17,on?'#ffe14d':'#c8c8d8','center','bold');
    }
    drawEndSkipHint();
    return;
  }
  if(E.phase==='gap') return;
  if(E.phase==='credits'){
    const p=G.player;
    const rows=[['― 플레이 기록 ―',''],
      ['HP',hpText(p.hp)+' / '+p.maxhp],
      ['머리숱',Math.round(p.hair)+'%'],
      ['면역력',String(p.immune||0)],
      ['전투력',String(p.power||0)],
      ['소지금',p.gold+'원'],
      ['플레이 시간',fmtTime(G.playTime)],
      ['획득한 엔딩',dexCount()+' / '+ENDING_ORDER.length]];
    for(let i=0;i<rows.length;i++){
      const show=E.cred-i*0.4; if(show<=0) continue;
      ctx.globalAlpha=clamp(show/0.5,0,1);
      if(rows[i][1]===''){ text(rows[i][0],320,62+i*26,17,'#8a90a4','center','bold'); }
      else{ text(rows[i][0],228,62+i*26,15,'#9aa0b0','left');
            text(rows[i][1],412,62+i*26,15,'#fff','right'); }
      ctx.globalAlpha=1;
    }
    const d1=clamp((E.cred-3.4)/0.6,0,1);
    if(d1>0){
      ctx.globalAlpha=d1; rect(220,264,200,2,'#3a3a4a');
      text('Developer',320,280,14,'#8a90a4','center');
      ctx.font="30px 'Jua','Nanum Gothic Coding',sans-serif";
      ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#ffe14d';
      ctx.fillText('솔여닁',320,300); ctx.globalAlpha=1;
    }

function openNotice(){ G.scene='notice'; G.notice={t:0,sel:0,save:readSave()}; SFX.menu(); }
function noticeButtons(){ return [{x:80,y:352,w:220,h:52,label:'처음으로 돌아가기'},
                                  {x:340,y:352,w:220,h:52,label:'마지막 세이브로'}]; }
function updateNotice(dt){
  const N=G.notice; N.t+=dt;
  const btns=noticeButtons();
  if(hit('KeyA','ArrowLeft')||hit('Digit1')){ N.sel=0; SFX.menu(); }
  if(hit('KeyD','ArrowRight')||hit('Digit2')){ N.sel=1; SFX.menu(); }
  let go=-1;
  for(let i=0;i<btns.length;i++) if(clickIn(btns[i])) go=i;
  if(click) click=null;
  if(okHit()) go=N.sel;
  if(go===0){ SFX.ok(); fadeTo(()=>{ resetGame(); G.scene='menu'; G.menu.sel=0; }); }
  else if(go===1){
    SFX.ok(); const s=N.save;
    if(s) fadeTo(()=>applySave(s));
    else fadeTo(()=>{ resetGame(); G.scene='field'; enterRoom('home'); });
  }
}
function drawNotice(){
  rect(0,0,W,H,'#05050a');
  for(let i=0;i<70;i++){ const x=(i*137)%W,y=((i*211)+G.t*10)%H;
    ctx.globalAlpha=.35; rect(x,y,2,2,'#2a2a3a'); ctx.globalAlpha=1; }
  const N=G.notice;
  ctx.globalAlpha=clamp(N.t*1.6,0,1);
  const bx=60,by=60,bw=520,bh=360;
  rect(bx,by,bw,bh,'#0a0a12'); frameR(bx,by,bw,bh,'#ffe14d',4);
  text('!  미  완  성  !',320,by+24,30,'#ffe14d','center','bold');
  rect(bx+40,by+66,bw-80,2,'#3a3a4a');
  text('여기까지가 현재 제작된 스토리입니다.',320,by+86,17,'#fff','center');
  text('이후 내용은 아직 만드는 중입니다.',320,by+114,17,'#fff','center');
  text('엔딩은 계속 추가됩니다. 지금까지 '+dexCount()+' / '+ENDING_ORDER.length+' 개 수집',
       320,by+156,13,'#8a90a4','center');
  drawSprite('hancheol',262,by+186,2.2,'right',Math.floor(G.t*3)%2,G.player.hair);
  jeomAt(334,by+186+31*2.2,31*2.2*JEOM_SCALE,0,false);
  const btns=noticeButtons();
  for(let i=0;i<btns.length;i++){
    const b=btns[i],on=(N.sel===i);
    rect(b.x,b.y,b.w,b.h,on?'#1c1a10':'#000');
    frameR(b.x,b.y,b.w,b.h,on?'#ffe14d':'#6a6a80',3);
    text((i+1)+'. '+b.label,b.x+b.w/2,b.y+17,16,on?'#ffe14d':'#c8c8d8','center','bold');
  }
  const s=N.save;
  text(s?('마지막 저장 : '+(ROOMS[s.room]?ROOMS[s.room].name:'?')):'저장된 기록이 없습니다',
       320,418,12,'#6a6a80','center');
  text('← → 선택 · ENTER 확인 · 클릭 가능',320,444,12,'#4a4a5a','center');
  ctx.globalAlpha=1;
}

  const out=[{k:'new',label:'\uc0c8\ub85c \uc2dc\uc791'}];
  if(readSave()) out.push({k:'load',label:'\uc774\uc5b4\ud558\uae30'});
  if(anyChapterOpen()) out.push({k:'chapters',label:'\ucc55\ud130 \uc120\ud0dd'});
  out.push({k:'dex',label:'\uc5d4\ub529 \ub3c4\uac10  ('+dexCount()+'/'+ENDING_ORDER.length+')'});
  out.push({k:'patch',label:'\ud328\uce58\ub178\ud2b8'});
  out.push({k:'settings',label:'\ud658\uacbd\uc124\uc815'});
  return out;
}
/* 버튼을 2열 × ⌈n/2⌉행 그리드로 배치한다. 홀수 개면 마지막 한 칸은 왼쪽 열에 단독 배치.
   각 열은 화면 중앙(320) 기준 좌우 대칭, 버튼 크기는 항목 수와 무관하게 고정.
   ↑↓는 배열 순서(왼쪽열→오른쪽열, 위→아래 행)를 그대로 따라가므로 자연스럽게 행 단위로 이동한다 */
/* ?? ??? ?? ? ?. ??? [?? ??] ???? ???. */
const MENU_TOP=164, MENU_BOT=382, MENU_W=240, MENU_H=30;
function menuButtons(){
  const items=menuItems(), n=items.length;
  const gapY=n>1?Math.max(4,Math.floor(((MENU_BOT-MENU_TOP)-n*MENU_H)/(n-1))):0;
  const total=n*MENU_H+(n-1)*gapY;
  const y0=MENU_TOP+((MENU_BOT-MENU_TOP)-total)/2;
  return items.map((it,i)=>({
    x:320-MENU_W/2, y:Math.round(y0+i*(MENU_H+gapY)),
    w:MENU_W, h:MENU_H, label:it.label, k:it.k
  }));
}

function openPause(){ G.scene='pause'; G.pauseSel=0; G.pauseConfirm=false; SFX.menu(); }
function pauseItems(){
  return [ {k:'resume',label:'계속하기'},
           {k:'save',  label:'저장하기'},
           {k:'set',   label:'환경설정'},
           {k:'quit',  label:'메뉴로 나가기'} ];
}
function pauseButtons(){ return pauseItems().map((it,i)=>({x:200,y:172+i*44,w:240,h:38,label:it.label,k:it.k})); }
function updatePause(dt){
  const btns=pauseButtons(), n=btns.length;
  if(G.pauseConfirm){
    const yes={x:180,y:300,w:120,h:38}, no={x:340,y:300,w:120,h:38};
    let g=null;
    if(clickIn(yes)) g='y'; else if(clickIn(no)) g='n';
    if(click) click=null;
    if(hit('KeyA','ArrowLeft'))  { G.pauseYes=true;  SFX.menu(); }
    if(hit('KeyD','ArrowRight')) { G.pauseYes=false; SFX.menu(); }
    if(okHit()) g = G.pauseYes?'y':'n';
    if(hit('Escape')) g='n';
    if(g==='y'){ SFX.ok(); saveGame(true); G.pauseConfirm=false;
                 fadeTo(()=>{ G.dlg=null; G.wait=null; G.inv=false; G.scene='menu'; G.menu.sel=0; }); }
    else if(g==='n'){ SFX.menu(); G.pauseConfirm=false; }
    return;
  }
  if(upHit())   { G.pauseSel=(G.pauseSel+n-1)%n; SFX.menu(); }
  if(downHit()) { G.pauseSel=(G.pauseSel+1)%n;   SFX.menu(); }

function updateSettings(dt){
  const btns=setButtons(), n=btns.length;
  if(G.setSel===undefined) G.setSel=0;
  if(upHit())   { G.setSel=(G.setSel+n-1)%n; SFX.menu(); }
  if(downHit()) { G.setSel=(G.setSel+1)%n;   SFX.menu(); }
  const back={x:230,y:412,w:180,h:34};
  const backTo=()=>{ SFX.menu(); G.scene=(G.setFrom==='pause')?'pause':'menu'; G.setFrom=null; };
  let go=null;
  for(let i=0;i<n;i++) if(clickIn(btns[i])){ G.setSel=i; go=btns[i].item.k; }
  if(clickIn(back)){ click=null; backTo(); return; }
  if(click) click=null;
  if(hit('Escape')){ backTo(); return; }
  if(okHit()) go=btns[G.setSel].item.k;
  if(!go) return;

  if(go==='mobile'){ SFX.ok(); setMobile(!MOBILE); }
  else if(go==='mute'){ SFX.ok(); muted=!muted; SET.mute=muted; saveSet(); if(!muted) SFX.ok(); }
  else if(go==='intro'){
    if(!introUnlocked()){ SFX.bad?SFX.bad():SFX.menu(); toast('암살자 엔딩을 먼저 획득하세요'); return; }
    SFX.ok(); SET.skipIntro=!SET.skipIntro; saveSet();
  }
  else if(go==='dev'){
    if(SET.dev){ SFX.ok(); SET.dev=false; saveSet(); toast('개발자 모드 OFF'); return; }
    SFX.menu();
    askName('개발자 비밀번호',v=>{
      if((v||'').trim()===DEV_PASS){ SET.dev=true; saveSet(); SFX.ok(); toast('개발자 모드 ON'); }
      else toast('비밀번호가 틀렸습니다');
    },true);
  }
}

  vRect(0,0,MW,MH,'#08080e');
  const ga=gameArea();
  vFrame(ga.x-2,ga.y-2,ga.w+4,ga.h+4,'#2a2a38',2);
  // 조작판 배경
  vRect(0,ga.y+ga.h+10,MW,MH-(ga.y+ga.h+10),'#0d0d15');
  vRect(0,ga.y+ga.h+10,MW,2,'#22222e');
  // 십자키 받침
  vctx.globalAlpha=.5;
  vRect(DP.cx-DP.g-DP.s/2-6,DP.cy-DP.s/2-6,DP.g*2+DP.s+12,DP.s+12,'#12121c');
  vRect(DP.cx-DP.s/2-6,DP.cy-DP.g-DP.s/2-6,DP.s+12,DP.g*2+DP.s+12,'#12121c');
  vctx.globalAlpha=1;
  for(const b of MOB_BTNS){
    const on=touchKeys.has(b.key);
    if(b.kind==='c'){
      vctx.beginPath(); vctx.arc(b.cx,b.cy,b.r,0,6.2832);
      vctx.fillStyle=on?'#3a3418':'#14141f'; vctx.fill();
      vctx.lineWidth=3; vctx.strokeStyle=on?'#ffe14d':'#4a4a5c'; vctx.stroke();
      vText(b.label,b.cx,b.cy,b.big?18:12,on?'#ffe14d':'#b8b8c8','bold');
    }else{
      vRect(b.x,b.y,b.w,b.h,on?'#3a3418':'#14141f');
      vFrame(b.x,b.y,b.w,b.h,on?'#ffe14d':'#4a4a5c',3);
      vText(b.label,b.x+b.w/2,b.y+b.h/2,b.size||24,on?'#ffe14d':'#b8b8c8','bold');
    }
  }
  vText('모바일 모드 · 환경설정에서 끌 수 있음',MW/2,MH-12,10,'#3a3a48');
}
function present(){
  if(!MOBILE){ vctx.clearRect(0,0,W,H); vctx.drawImage(cv,0,0); return; }
  drawMobileUI();
  const ga=gameArea();
  vctx.drawImage(cv,0,0,W,H,ga.x,ga.y,ga.w,ga.h);
}

/* =========================================================================
   메인 루프
   ========================================================================= */
let last=0;
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000)||0;
  last=t; G.t+=dt;
  G.shake=Math.max(0,G.shake-dt*1.2);
  G.cut.flash=Math.max(0,G.cut.flash-dt*1.6);
  if(G.rush){ G.rush.t+=dt; G.rush.x-=760*dt; if(G.rush.x<-90) G.rush=null; }
  // 문이 열리고 누군가 걸어 들어오는 연출
  updateActors(dt);
  if(G.closeUp){ G.closeUp.t-=dt; if(G.closeUp.t<=0) G.closeUp=null; }
  if(G.doorOpen>0) G.doorOpen=Math.min(1,G.doorOpen+dt*2.2);
  if(G.playerFade>0) G.playerFade=Math.max(0,G.playerFade-dt);
  if(G.walkIn){
    const w=G.walkIn;
    if(w.delay>0){ w.delay-=dt; }
    else{
      const dx=w.tx-w.x, dy=w.ty-w.y, d=Math.hypot(dx,dy);
      if(d>2){ const s=Math.min(d,86*dt); w.x+=dx/d*s; w.y+=dy/d*s; w.walk+=dt*8; }
    }
  }
  if(G.toast){ G.toast.t-=dt; if(G.toast.t<=0) G.toast=null; }
  if(hit('KeyM')){ muted=!muted; SET.mute=muted; saveSet(); toast(muted?'소리 끔':'소리 켬'); }
  // 개발자 모드 : 대화창의 건너뛰기 버튼을 누르고 있는 중인가
  skipHeld = !!(SET.dev && G.dlg && ptDown && ptGame &&
                ptGame.x>=SKIP_BTN.x && ptGame.x<=SKIP_BTN.x+SKIP_BTN.w &&
                ptGame.y>=SKIP_BTN.y && ptGame.y<=SKIP_BTN.y+SKIP_BTN.h);

  updateFade(dt);
  const blocked=(G.fadeDir!==0&&G.fade>0.55)||nameOpen();
  if(nameOpen()) click=null;

  switch(G.scene){
    case 'menu':     if(!blocked) updateMenu(dt);     drawMenu();     break;
    case 'chapters': if(!blocked) updateChapters(dt); drawChapters(); break;
    case 'dex':    if(!blocked) updateDex(dt);    drawDex();    break;
    case 'patch':  if(!blocked) updatePatch(dt);  drawPatch();  break;
    case 'settings': if(!blocked) updateSettings(dt); drawSettings(); break;
    case 'pause':  if(!blocked) updatePause(dt);  drawPause();  break;
    case 'notice': if(!blocked) updateNotice(dt); drawNotice(); break;
    case 'field':
      if(!blocked) updateField(dt);
      updateParts(dt);
      drawField(G.player.down||G.player.hp<=0);
      break;
    case 'ending': updateEnding(dt); drawEnding(); break;
  }
  if(G.fade>0){ ctx.globalAlpha=G.fade; rect(0,0,W,H,'#000'); ctx.globalAlpha=1; }
  if(G.toast && G.scene!=='field'){
    ctx.globalAlpha=clamp(G.toast.t,0,1);
    rect(190,238,260,34,'#000'); frameR(190,238,260,34,'#ffe14d',2);
    text(G.toast.msg,320,247,14,'#ffe14d','center','bold');
    ctx.globalAlpha=1;
  }
  present();
  if(click) click=null;
  clearPressed();
  requestAnimationFrame(loop);
}

resetGame();
G.room='home';
G.scene='menu';
requestAnimationFrame(loop);
</script>
